[project]
name = "nfl_draft_sim"
version = "0.1.0"
description = "nfl_draft_sim using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.80.0,<1.0.0",
    "nfl_data_py",
    "agentops",
    "numpy",
]

[project.scripts]
nfl_draft_sim = "nfl_draft_sim.main:run"
run_crew = "nfl_draft_sim.main:run"
train = "nfl_draft_sim.main:train"
replay = "nfl_draft_sim.main:replay"
test = "nfl_draft_sim.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
