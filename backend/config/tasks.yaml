research_task:
  description: >
    Collect comprehensive NFL data related to the request: {query}, including recent news, historical data, and relevant statistics.
  expected_output: >
    A detailed research document with organized raw data and initial findings.

statistical_analysis_task:
  description: >
    Analyze the collected data to identify statistical patterns and trends relevant to the request: {query}.
  expected_output: >
    A detailed statistical analysis report with key metrics, trends, and supporting data.

game_analysis_task:
  description: >
    Analyze game situations and strategic elements related to the request: {query}, incorporating statistical findings.
  expected_output: >
    Detailed game analysis report with strategic insights and situational breakdowns.

synthesis_task:
  description: >
    Integrate all research, statistics, and game analysis into comprehensive insights for meaningful NFL analysis on: {query}.
  expected_output: >
    A cohesive analysis report that combines all perspectives into actionable insights.